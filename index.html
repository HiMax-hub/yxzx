    <meta charset="UTF-8" />

    <title>雁讯咨询贷款CRM与业务工作台</title>
    <meta name="description" content="面向助贷与贷款咨询业务的全链路CRM与业务工作台" />
    <script>
      // Defensive fix for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if cannot redefine
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
